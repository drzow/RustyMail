# Minimal Dovecot config for ManageSieve integration tests. Not a
# template for production — it only enables what the rustymail tests
# poke at: ManageSieve on :4190 with STARTTLS, PLAIN auth, scripts in
# the user's home dir.

protocols = sieve

listen = *

# Dovecot inside the container runs as the test user with no chroot
# so writes to /var/mail/testuser/sieve work without escalations.

auth_mechanisms = plain
disable_plaintext_auth = no   # We require STARTTLS at the protocol
                              # layer via the SASL/STARTTLS interplay
                              # below; clients that connect cleartext
                              # and try AUTHENTICATE will be refused
                              # by ssl=required.

passdb {
  driver = passwd-file
  args   = scheme=PLAIN /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args   = /etc/dovecot/users
}

# STARTTLS is mandatory — clients that try to authenticate over
# cleartext are rejected, matching what real public servers do.
ssl              = required
ssl_cert         = </etc/ssl/dovecot/cert.pem
ssl_key          = </etc/ssl/dovecot/key.pem
ssl_min_protocol = TLSv1.2

# ManageSieve port + plugin wiring.
service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service managesieve {
}

# mail_location keeps Pigeonhole's storage layer happy after login;
# we don't actually deliver mail in the test, but the managesieve
# process refuses to come up without it.
mail_location = maildir:~/Maildir

protocol sieve {
  managesieve_max_compile_errors = 5
}

# Pigeonhole 0.5+ wants the sieve setting inside a plugin{} block.
plugin {
  sieve        = file:~/sieve;active=~/.dovecot.sieve
  sieve_dir    = ~/sieve
  sieve_extensions = +editheader +imapsieve
}

# Quiet logs for the test container — the host docker-compose stdout
# is enough.
log_path = /dev/stderr
info_log_path = /dev/stderr
