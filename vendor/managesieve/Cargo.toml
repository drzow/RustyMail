# Vendored from crates.io managesieve 0.1.1 (Andy Grover, 2022).
# Local fork: nom bumped 6.2 -> 7 to coexist with rustymail's memchr ^2.7
# constraint (utoipa-swagger-ui -> zip). Parser body patched for the
# 6 -> 7 API drift (escaped_transform return type).

[package]
edition = "2021"
name = "managesieve"
version = "0.1.1"
authors = ["Andy Grover <andy@groveronline.com>"]
description = "Support for parsing ManageSieve protocol (RFC 5804)"
license = "MIT OR Apache-2.0"
publish = false
resolver = "2"

[dependencies]
either = "1.6.1"
nom = "7"
